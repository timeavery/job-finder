name: Job Search

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Run script
        run: python jobs.py
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
