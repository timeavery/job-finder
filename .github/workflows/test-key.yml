name: Test Key

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Reed test
        run: python reed_test.py
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
